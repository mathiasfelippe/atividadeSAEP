<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Eleitoral — Atividade SAEP</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");
      :root {
        --navy: #102a43;
        --blue: #2563eb;
        --cyan: #06b6d4;
        --ink: #172033;
        --muted: #718096;
        --line: #e6edf5;
        --bg: #f5f8fc;
        --white: #fff;
        --green: #059669;
        --red: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px "DM Sans",
          Arial,
          sans-serif;
      }
      body:before {
        content: "";
        display: block;
        height: 5px;
        background: linear-gradient(90deg, var(--blue), var(--cyan), #8b5cf6);
      }
      header {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          120deg,
          #102a43 0%,
          #174c78 60%,
          #136a8a 100%
        );
        color: #fff;
        padding: 48px max(22px, calc((100% - 1120px) / 2));
        box-shadow: 0 8px 24px #0b29431f;
      }
      header:after {
        content: "";
        position: absolute;
        width: 310px;
        height: 310px;
        border: 50px solid #ffffff0c;
        border-radius: 50%;
        right: -80px;
        top: -155px;
      }
      header h1 {
        position: relative;
        margin: 0 0 9px;
        font:
          700 34px "Space Grotesk",
          Arial,
          sans-serif;
        letter-spacing: -0.8px;
      }
      header h1:before {
        content: "✦";
        display: inline-grid;
        place-items: center;
        margin-right: 12px;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #ffffff1c;
        color: #7dd3fc;
        font-size: 20px;
      }
      header p {
        position: relative;
        margin: 0;
        color: #c9e5f5;
        font-size: 15px;
      }
      .container {
        max-width: 1120px;
        margin: 32px auto;
        padding: 0 22px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 26px;
      }
      .card {
        position: relative;
        overflow: hidden;
        background: var(--white);
        border: 1px solid #e9f0f7;
        border-radius: 16px;
        padding: 24px 27px;
        box-shadow: 0 8px 25px #173b6710;
      }
      .card:after {
        content: "";
        position: absolute;
        right: -28px;
        bottom: -38px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: #dbeafe80;
      }
      .card:nth-child(2):after {
        background: #cffafe99;
      }
      .card strong {
        position: relative;
        z-index: 1;
        display: block;
        font:
          700 38px "Space Grotesk",
          Arial,
          sans-serif;
        color: var(--blue);
        line-height: 1;
      }
      .card:nth-child(2) strong {
        color: #0891b2;
      }
      .card span {
        position: relative;
        z-index: 1;
        display: block;
        margin-top: 9px;
        color: var(--muted);
        font-weight: 500;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }
      .tabs button,
      .btn {
        border: 0;
        border-radius: 9px;
        padding: 12px 17px;
        font:
          600 14px "DM Sans",
          Arial,
          sans-serif;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .tabs button {
        background: var(--navy);
        color: #fff;
        box-shadow: 0 5px 12px #102a4330;
      }
      .tabs button.secondary {
        background: #e8eef5;
        color: #52657a;
        box-shadow: none;
      }
      .tabs button:hover,
      .btn:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }
      .panel {
        background: var(--white);
        border: 1px solid #e7eef6;
        border-radius: 16px;
        padding: 27px;
        box-shadow: 0 10px 30px #173b670c;
      }
      .panel h2 {
        margin: 0 0 22px;
        font:
          700 23px "Space Grotesk",
          Arial,
          sans-serif;
        color: var(--navy);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .panel h2:before {
        content: "";
        display: block;
        width: 5px;
        height: 24px;
        border-radius: 5px;
        background: linear-gradient(var(--blue), var(--cyan));
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 17px;
        margin-bottom: 22px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
        color: #52657a;
      }
      input {
        display: block;
        width: 100%;
        margin-top: 7px;
        border: 1px solid #d5e0eb;
        border-radius: 8px;
        background: #fbfdff;
        padding: 11px 12px;
        color: var(--ink);
        font:
          14px "DM Sans",
          Arial,
          sans-serif;
        outline: 0;
        transition: 0.2s;
      }
      input:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 4px #dbeafe;
        background: #fff;
      }
      .btn {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 5px 12px #2563eb2b;
      }
      .btn.secondary {
        margin-left: 8px;
        background: #edf2f7;
        color: #52657a;
        box-shadow: none;
      }
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 650px;
        margin-top: 22px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 14px;
        text-align: left;
      }
      th {
        background: #f3f7fb;
        color: #52657a;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      td {
        color: #405267;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #f8fbff;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .action {
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        font:
          600 12px "DM Sans",
          Arial,
          sans-serif;
        cursor: pointer;
        transition: 0.2s;
      }
      .action:hover {
        transform: translateY(-1px);
      }
      .edit {
        background: #e0edff;
        color: #1d4ed8;
      }
      .del {
        background: #fee7e7;
        color: #b91c1c;
      }
      .hidden {
        display: none;
      }
      .notice {
        margin: 16px 0;
        padding: 12px 14px;
        border: 1px solid #a7f3d0;
        border-radius: 8px;
        background: #ecfdf5;
        color: #047857;
        font-weight: 600;
      }
      footer {
        text-align: center;
        padding: 34px;
        color: #8a9aac;
        font-size: 13px;
      }
      @media (max-width: 700px) {
        header {
          padding: 36px 20px;
        }
        header h1 {
          font-size: 28px;
        }
        .container {
          margin: 22px auto;
          padding: 0 14px;
        }
        .cards,
        .tabs {
          grid-template-columns: 1fr;
          display: flex;
          flex-direction: column;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 20px;
        }
        .tabs button {
          width: 100%;
        }
        .card {
          padding: 21px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CRUD Eleitoral</h1>
      <p>Atividade SAEP — HTML, CSS e JavaScript</p>
    </header>
    <main class="container">
      <div class="cards">
        <div class="card">
          <strong id="totalEleitores">0</strong
          ><span>Eleitores cadastrados</span>
        </div>
        <div class="card">
          <strong id="totalCandidatos">0</strong
          ><span>Candidatos cadastrados</span>
        </div>
      </div>
      <div class="tabs">
        <button id="tabEleitores" onclick="showTab('eleitores')">
          Gerenciar eleitores</button
        ><button
          id="tabCandidatos"
          class="secondary"
          onclick="showTab('candidatos')"
        >
          Gerenciar candidatos
        </button>
      </div>
      <section id="eleitores" class="panel">
        <h2>Eleitores</h2>
        <form id="formEleitor">
          <input type="hidden" id="eleitorId" />
          <div class="grid">
            <label>Nome completo*<input required id="eNome" /></label
            ><label>CPF*<input required id="eCpf" /></label
            ><label>Título de eleitor*<input required id="eTitulo" /></label
            ><label
              >Data de nascimento*<input
                required
                type="date"
                id="eData" /></label
            ><label>Zona eleitoral<input type="number" id="eZona" /></label
            ><label>Seção eleitoral<input type="number" id="eSecao" /></label
            ><label>Endereço<input id="eEndereco" /></label
            ><label>Cidade<input id="eCidade" /></label
            ><label>Estado<input maxlength="2" id="eEstado" /></label
            ><label>E-mail<input type="email" id="eEmail" /></label
            ><label>Telefone<input id="eTelefone" /></label>
          </div>
          <button class="btn" type="submit">Salvar eleitor</button
          ><button
            class="btn secondary"
            type="button"
            onclick="clearForm('eleitor')"
          >
            Limpar
          </button>
        </form>
        <div id="msgE"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Título</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaEleitores"></tbody>
          </table>
        </div>
      </section>
      <section id="candidatos" class="panel hidden">
        <h2>Candidatos</h2>
        <form id="formCandidato">
          <input type="hidden" id="candidatoId" />
          <div class="grid">
            <label>Nome completo*<input required id="cNome" /></label
            ><label>Número*<input required type="number" id="cNumero" /></label
            ><label>Partido*<input required id="cPartido" /></label
            ><label>Cargo*<input required id="cCargo" /></label
            ><label>Data de nascimento<input type="date" id="cData" /></label
            ><label>E-mail<input type="email" id="cEmail" /></label
            ><label>Telefone<input id="cTelefone" /></label>
          </div>
          <button class="btn" type="submit">Salvar candidato</button
          ><button
            class="btn secondary"
            type="button"
            onclick="clearForm('candidato')"
          >
            Limpar
          </button>
        </form>
        <div id="msgC"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Número</th>
                <th>Partido</th>
                <th>Cargo</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="listaCandidatos"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>CRUD Eleitoral — Atividade SAEP</footer>
    <script>
      let eleitores = [],
        candidatos = [];
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      async function api(tipo, metodo = "GET", dados = null) {
        const op = {
          method: metodo,
          headers: { "Content-Type": "application/json" },
        };
        if (dados) op.body = JSON.stringify(dados);
        const r = await fetch("api.php?tipo=" + tipo, op);
        const j = await r.json();
        if (!r.ok) throw new Error(j.erro || "Erro na API");
        return j;
      }
      async function load() {
        try {
          [eleitores, candidatos] = await Promise.all([
            api("eleitores"),
            api("candidatos"),
          ]);
          render();
        } catch (e) {
          alert("Não foi possível carregar o banco de dados: " + e.message);
        }
      }
      function render() {
        document.getElementById("totalEleitores").textContent =
          eleitores.length;
        document.getElementById("totalCandidatos").textContent =
          candidatos.length;
        document.getElementById("listaEleitores").innerHTML = eleitores
          .map(
            (x) =>
              `<tr><td>${x.id}</td><td>${esc(x.nome)}</td><td>${esc(x.cpf)}</td><td>${esc(x.titulo)}</td><td>${esc(x.cidade)}/${esc(x.estado)}</td><td><button class="action edit" onclick="editE(${x.id})">Editar</button> <button class="action del" onclick="delE(${x.id})">Excluir</button></td></tr>`,
          )
          .join("");
        document.getElementById("listaCandidatos").innerHTML = candidatos
          .map(
            (x) =>
              `<tr><td>${x.id}</td><td>${esc(x.nome)}</td><td>${esc(x.numero)}</td><td>${esc(x.partido)}</td><td>${esc(x.cargo)}</td><td><button class="action edit" onclick="editC(${x.id})">Editar</button> <button class="action del" onclick="delC(${x.id})">Excluir</button></td></tr>`,
          )
          .join("");
      }
      function showTab(t) {
        document
          .getElementById("eleitores")
          .classList.toggle("hidden", t !== "eleitores");
        document
          .getElementById("candidatos")
          .classList.toggle("hidden", t !== "candidatos");
        document
          .getElementById("tabEleitores")
          .classList.toggle("secondary", t !== "eleitores");
        document
          .getElementById("tabCandidatos")
          .classList.toggle("secondary", t !== "candidatos");
      }
      function val(id) {
        return document.getElementById(id).value;
      }
      function set(id, v) {
        document.getElementById(id).value = v || "";
      }
      function msg(id, t) {
        document.getElementById(id).innerHTML =
          '<div class="notice">' + t + "</div>";
        setTimeout(() => (document.getElementById(id).innerHTML = ""), 2500);
      }
      document.getElementById("formEleitor").onsubmit = async (e) => {
        e.preventDefault();
        let id = +val("eleitorId");
        let x = {
          id,
          nome: val("eNome"),
          cpf: val("eCpf"),
          titulo: val("eTitulo"),
          data: val("eData"),
          zona: val("eZona"),
          secao: val("eSecao"),
          endereco: val("eEndereco"),
          cidade: val("eCidade"),
          estado: val("eEstado").toUpperCase(),
          email: val("eEmail"),
          telefone: val("eTelefone"),
        };
        try {
          await api("eleitores", id ? "PUT" : "POST", x);
          await load();
          clearForm("eleitor");
          msg("msgE", "Eleitor salvo no banco de dados!");
        } catch (e) {
          msg("msgE", e.message);
        }
      };
      document.getElementById("formCandidato").onsubmit = async (e) => {
        e.preventDefault();
        let id = +val("candidatoId");
        let x = {
          id,
          nome: val("cNome"),
          numero: val("cNumero"),
          partido: val("cPartido"),
          cargo: val("cCargo"),
          data: val("cData"),
          email: val("cEmail"),
          telefone: val("cTelefone"),
        };
        try {
          await api("candidatos", id ? "PUT" : "POST", x);
          await load();
          clearForm("candidato");
          msg("msgC", "Candidato salvo no banco de dados!");
        } catch (e) {
          msg("msgC", e.message);
        }
      };
      function editE(id) {
        let x = eleitores.find((a) => a.id === id);
        set("eleitorId", x.id);
        Object.entries({
          eNome: x.nome,
          eCpf: x.cpf,
          eTitulo: x.titulo,
          eData: x.data,
          eZona: x.zona,
          eSecao: x.secao,
          eEndereco: x.endereco,
          eCidade: x.cidade,
          eEstado: x.estado,
          eEmail: x.email,
          eTelefone: x.telefone,
        }).forEach(([a, b]) => set(a, b));
        showTab("eleitores");
        scrollTo(0, 0);
      }
      function editC(id) {
        let x = candidatos.find((a) => a.id === id);
        set("candidatoId", x.id);
        Object.entries({
          cNome: x.nome,
          cNumero: x.numero,
          cPartido: x.partido,
          cCargo: x.cargo,
          cData: x.data,
          cEmail: x.email,
          cTelefone: x.telefone,
        }).forEach(([a, b]) => set(a, b));
        showTab("candidatos");
        scrollTo(0, 0);
      }
      async function delE(id) {
        if (confirm("Excluir este eleitor?")) {
          try {
            await api("eleitores", "DELETE", { id });
            await load();
          } catch (e) {
            alert(e.message);
          }
        }
      }
      async function delC(id) {
        if (confirm("Excluir este candidato?")) {
          try {
            await api("candidatos", "DELETE", { id });
            await load();
          } catch (e) {
            alert(e.message);
          }
        }
      }
      function clearForm(t) {
        document
          .getElementById(t === "eleitor" ? "formEleitor" : "formCandidato")
          .reset();
        set(t === "eleitor" ? "eleitorId" : "candidatoId", "");
      }
      load();
    </script>
  </body>
</html>
